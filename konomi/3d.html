<div id="scene"></div>
<div class="hud">

</div>
<script>window.NAV_CONFIG={mode:'3d',base:'.',current:'root',home:'../'};</script>
<script src="nav.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="engine.js"></script>
